name: Compilar plugin Paper 26.2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compilar e executar todos os testes
        run: |
          set -o pipefail
          mvn -B -ntp -C verify 2>&1 | tee build.log
      - name: Diagnóstico de falhas
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          def error(title, message):
              message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title={title}::{message}')
          found = False
          for path in Path('target/surefire-reports').glob('TEST-*.xml'):
              root = ET.parse(path).getroot()
              for case in root.findall('testcase'):
                  for tag in ('failure', 'error', 'skipped'):
                      for result in case.findall(tag):
                          found = True
                          error(case.get('classname', '') + '.' + case.get('name', ''), (result.get('message', '') + '\n' + (result.text or ''))[:5000])
          if not found and Path('build.log').exists():
              errors = [line for line in Path('build.log').read_text().splitlines() if '[ERROR]' in line]
              error('Maven', '\n'.join(errors[:30])[:10000])
          PY
      - name: Confirmar execução completa dos testes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = [ET.parse(p).getroot() for p in Path('target/surefire-reports').glob('TEST-*.xml')]
          totals = {k: sum(int(r.get(k, 0)) for r in reports) for k in ['tests', 'failures', 'errors', 'skipped']}
          print(totals)
          assert totals['tests'] >= 27, 'A suíte completa precisa executar, incluindo MockBukkit'
          assert not any(totals[k] for k in ['failures', 'errors', 'skipped']), 'Testes falharam ou foram ignorados'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: reliquias-nether-paper-26.2
          path: target/reliquias-nether-1.0.0.jar
          if-no-files-found: error
      - name: Publicar JAR no GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_TAG: build-${{ github.run_number }}
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          sha256sum target/reliquias-nether-1.0.0.jar > target/reliquias-nether-1.0.0.jar.sha256
          gh release create "$BUILD_TAG" \
            --target "$BUILD_COMMIT" \
            --title "Relíquias Nether — $BUILD_TAG (Paper 26.2)" \
            --notes 'Build Java 25 aprovado na suíte automatizada. O teste funcional com servidor, Geyser/Floodgate e proteções reais está descrito no README.' \
            --prerelease \
            target/reliquias-nether-1.0.0.jar \
            target/reliquias-nether-1.0.0.jar.sha256
      - name: Relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-testes
          path: target/surefire-reports/
          if-no-files-found: ignore
